# Local dev compose for server-side consumers (dataprem-chat) that need to
# reach the MCP over HTTP. Desktop clients keep using `uvx dataprem-mcp`
# (stdio) — they don't go through this service.
#
# The service does NOT publish any port to the host: it is meant to live in a
# shared Docker network with its consumer. Connect dataprem-chat to that
# network and use http://dataprem_mcp:8080/ as DATAPREM_MCP_URL.

services:
  dataprem_mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: dataprem-mcp:dev
    container_name: dataprem_mcp
    restart: unless-stopped
    environment:
      DATAPREM_API_URL: ${DATAPREM_API_URL:-https://api.dataprem.com}
      DATAPREM_API_KEY: ${DATAPREM_API_KEY:?set DATAPREM_API_KEY in your env or .env}
    healthcheck:
      # Cheap port-open probe — Streamable HTTP requires an MCP `initialize`
      # handshake before any other endpoint, so a deeper healthcheck would
      # need to maintain a session. Liveness via TCP connect is enough.
      test: ["CMD", "python", "-c", "import socket,sys;s=socket.socket();s.settimeout(2);s.connect(('127.0.0.1',8080));s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - default

# When dataprem-chat lives in another compose, attach it to this network with:
#   networks:
#     - dataprem_mcp_default
networks:
  default:
    name: dataprem_mcp_default
